# dsh-auto-research. One row per package of the bundle:
# - the core: the `auto-research` SubagentProvider, the workers' `research_run`
#   tool and the `researchExecutor` registry;
# - LayerFS: `ctx.researchWorkspace` (branches in the conversation's LayerFS
#   project) and the `sandbox` executor;
# - the coordinator and worker skills (prompts only);
# - the `subagent_auto_research` tool, one batch per call. Provider-managed
#   depth keeps it visible to the coordinator.
# Insert `dsh-auto-research-executor-colab` with its sessions for a Colab GPU.
- insert:
    - id: subagent-auto-research
      name: 'dsh-auto-research'
      config:
        providerName: auto-research
        workerProvider: spawn
        rounds: 3
        branches: 4
        explorationMinutes: 5
        exploitationMinutes: 15
        rsiTop: false
        forkAndFlush: true

    - id: auto-research-workspace-layerfs
      name: 'dsh-auto-research-workspace-layerfs'

    - id: auto-research-coordinator
      name: 'dsh-auto-research-coordinator'

    - id: auto-research-worker
      name: 'dsh-auto-research-worker'

    - id: tool-subagent-auto-research
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: auto-research
        toolName: subagent_auto_research
        maxDepth: provider-managed
