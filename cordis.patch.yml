# dsh-auto-research. The first row contributes the `auto-research`
# SubagentProvider, its skills and the `researchWorkspace` / `researchExecutor`
# registries. The layerfs and snapshot rows register workspace backends
# (LayerFS first, full-copy snapshot as the fallback); the local row runs the
# frozen evaluator on this host (insert `dsh-auto-research/colab` for a Colab
# GPU). The last row exposes one activation as the `subagent_auto_research`
# tool; provider-managed depth keeps it visible while each provider enforces
# its own recursion budget.
- insert:
    - id: subagent-auto-research
      name: 'dsh-auto-research'
      config:
        providerName: auto-research
        rounds: 1
        branches: 4
        explorationMinutes: 30
        exploitationMinutes: 30
        rsiTop: true
        forkAndFlush: true
        shareContext: false
        sharingIntervalMinutes: 10

    - id: auto-research-layerfs
      name: 'dsh-auto-research/layerfs'

    - id: auto-research-snapshot
      name: 'dsh-auto-research/snapshot'

    - id: auto-research-local
      name: 'dsh-auto-research/local'

    - id: tool-subagent-auto-research
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: auto-research
        toolName: subagent_auto_research
        maxDepth: provider-managed
